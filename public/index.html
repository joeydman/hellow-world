<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Pocket Claude</title>
<meta name="theme-color" content="#1f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Claude">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --line: #e2e0d9; --accent: #1f2a44; --accent-text: #ffffff; --user: #1f2a44;
    --user-text: #ffffff; --error: #a3302a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --surface: #1f1f1e; --text: #ecebe6; --muted: #9a9993;
      --line: #33332f; --accent: #d9dfee; --accent-text: #141414; --user: #2c3958;
      --user-text: #ecebe6; --error: #ef8a83;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header button {
    background: none; border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 14px;
  }
  main { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .empty { color: var(--muted); text-align: center; margin-top: 30vh; padding: 0 16px; }
  .msg { max-width: 760px; margin: 0 auto 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; max-width: 88%; }
  .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .assistant .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; max-width: 100%; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 22px; }
  .bubble h3 { font-size: 16px; margin: 10px 0 4px; }
  .bubble a { color: inherit; }
  .bubble code { font-family: ui-monospace, Menlo, monospace; font-size: 14px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .status { color: var(--muted); font-size: 14px; font-style: italic; }
  .error { color: var(--error); font-size: 14px; margin-top: 6px; }
  .sources { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; }
  .sources summary { color: var(--muted); cursor: pointer; }
  .sources ol { margin: 6px 0 0; padding-left: 20px; }
  .sources a { color: var(--text); }
  form {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px);
    border-top: 1px solid var(--line); background: var(--surface);
  }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 40vh;
    font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 22px; padding: 10px 16px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  form button {
    height: 44px; min-width: 64px; border: 0; border-radius: 22px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text);
  }
  form button:disabled { opacity: .5; }
  .lock { max-width: 360px; margin: 25vh auto 0; padding: 0 16px; text-align: center; }
  .lock input {
    width: 100%; font-size: 16px; padding: 12px 14px; border-radius: 12px; margin: 12px 0;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
  }
  .lock button {
    width: 100%; height: 44px; border: 0; border-radius: 12px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text);
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Pocket Claude</h1>
  <div>
    <button id="newChat" type="button">New chat</button>
    <button id="lockBtn" type="button">Lock</button>
  </div>
</header>

<main id="log"></main>

<form id="composer" autocomplete="off">
  <textarea id="input" rows="1" placeholder="Ask anything…" enterkeyhint="send"></textarea>
  <button id="send" type="submit">Send</button>
</form>

<div id="lock" class="lock" hidden>
  <p>Enter your password to unlock.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
  <button id="unlock" type="button">Unlock</button>
  <p id="lockErr" class="error" hidden></p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

let history = [];
try { history = JSON.parse(store.get("history") || "[]"); } catch { history = []; }
let busy = false;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Small, safe markdown subset: headings, bold, italics, code, links, lists, paragraphs.
function inline(s) {
  return escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(md) {
  const out = [];
  let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of md.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) {
      if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; }
      out.push(`<li>${inline(m[1])}</li>`);
    } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; }
      out.push(`<li>${inline(m[1])}</li>`);
    } else if ((m = line.match(/^#{1,6}\s+(.*)/))) {
      close(); out.push(`<h3>${inline(m[1])}</h3>`);
    } else if (!line.trim()) {
      close();
    } else {
      close(); out.push(`<p>${inline(line)}</p>`);
    }
  }
  close();
  return out.join("");
}

function addMessage(role, text, sources) {
  const empty = $("log").querySelector(".empty");
  if (empty) empty.remove();
  const row = document.createElement("div");
  row.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  row.appendChild(bubble);
  $("log").appendChild(row);
  const view = {
    bubble, text: text || "", sources: sources || [],
    status: "", error: "",
    render() {
      if (role === "user") { bubble.textContent = this.text; return; }
      let html = renderMarkdown(this.text);
      if (this.status && !this.text) html += `<div class="status">${escapeHtml(this.status)}</div>`;
      if (this.error) html += `<div class="error">${escapeHtml(this.error)}</div>`;
      if (this.sources.length) {
        html += `<details class="sources"><summary>Sources (${this.sources.length})</summary><ol>` +
          this.sources.map((s) => `<li><a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.title)}</a></li>`).join("") +
          "</ol></details>";
      }
      bubble.innerHTML = html;
    },
  };
  view.render();
  return view;
}

function scrollDown() { $("log").scrollTop = $("log").scrollHeight; }

function renderAll() {
  $("log").innerHTML = "";
  if (!history.length) {
    $("log").innerHTML = '<p class="empty">Ask a question. I can search the web for current information.</p>';
    return;
  }
  for (const m of history) addMessage(m.role, m.content, m.sources);
  scrollDown();
}

function save() { store.set("history", JSON.stringify(history)); }

function showLock(msg) {
  $("lock").hidden = false;
  $("log").hidden = true;
  $("composer").hidden = true;
  $("lockErr").hidden = !msg;
  $("lockErr").textContent = msg || "";
  $("pw").focus();
}
function hideLock() {
  $("lock").hidden = true;
  $("log").hidden = false;
  $("composer").hidden = false;
}

async function send(text) {
  if (busy || !text.trim()) return;
  busy = true;
  $("send").disabled = true;

  history.push({ role: "user", content: text });
  save();
  addMessage("user", text);
  const reply = addMessage("assistant", "");
  reply.status = "Thinking…";
  reply.render();
  scrollDown();

  const seen = new Set();
  let locked = false;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-App-Password": store.get("pw") || "" },
      body: JSON.stringify({ messages: history.map(({ role, content }) => ({ role, content })) }),
    });
    if (res.status === 401) {
      locked = true;
      return;
    }
    if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.t === "text") reply.text += ev.v;
        else if (ev.t === "status") reply.status = ev.v;
        else if (ev.t === "error") reply.error = ev.v;
        else if (ev.t === "source" && !seen.has(ev.v.url)) { seen.add(ev.v.url); reply.sources.push(ev.v); }
        reply.render();
        scrollDown();
      }
    }
  } catch (e) {
    reply.error = "Connection lost. Check your signal and try again.";
  } finally {
    busy = false;
    $("send").disabled = false;
    if (locked) {
      history.pop(); save();
      store.del("pw");
      renderAll();
      showLock("Wrong password.");
      return;
    }
    reply.status = "";
    reply.render();
    if (reply.text.trim()) {
      history.push({ role: "assistant", content: reply.text, sources: reply.sources });
    } else {
      history.pop(); // drop the unanswered question so the next send stays well-formed
    }
    save();
  }
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value;
  $("input").value = "";
  $("input").style.height = "";
  send(text);
});
$("input").addEventListener("input", () => {
  const el = $("input");
  el.style.height = "";
  el.style.height = el.scrollHeight + 2 + "px";
});
$("input").addEventListener("keydown", (e) => {
  const touch = matchMedia("(pointer: coarse)").matches;
  if (e.key === "Enter" && !e.shiftKey && !touch) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});
$("newChat").addEventListener("click", () => {
  if (busy) return;
  history = []; save(); renderAll();
});
$("lockBtn").addEventListener("click", () => {
  store.del("pw"); history = []; save(); renderAll(); showLock();
});
const unlock = () => {
  const pw = $("pw").value;
  if (!pw) return;
  store.set("pw", pw);
  $("pw").value = "";
  hideLock();
};
$("unlock").addEventListener("click", unlock);
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });

renderAll();
if (!store.get("pw")) showLock();
</script>
</body>
</html>
